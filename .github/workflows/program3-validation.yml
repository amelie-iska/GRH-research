name: Program 3 independent validation
on:
  push:
    branches: [program3-validation]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: program3-validation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated runner dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.17.1 sympy soundfile healpy==1.18.1 astropy==7.1.1 pyerfa==2.0.1.5 playwright==1.56.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd poppler-utils texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern
      - name: Apply recorded preflight repairs and bind source
        run: |
          python workbench/program3/prepare_ci.py
          python -m workbench.program3.formal_ecc --output workbench/lean/ECCFiniteGenerated.lean
          git config user.name 'GRH verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workbench/program3/cmb.py workbench/lean/Program3Contracts.lean workbench/lean/ECCFiniteGenerated.lean workbench/site/program3.html workbench/site/program3-app.js workbench/program3/visual_data.py extension/manuscript/chapters/synthesis.tex workbench/site/index.html
          if ! git diff --cached --quiet; then git commit -m 'Apply source-checked program-three preflight repairs and finite arithmetic certificates'; fi
          git rev-parse HEAD
      - name: Python, measured controls and browser replay data
        id: science
        run: |
          python workbench/program3/run_ci.py --data "$RUNNER_TEMP/program3-data" --evidence "$RUNNER_TEMP/program3-evidence"
      - name: Pinned Lean and strict declaration audit
        run: |
          mkdir -p "$RUNNER_TEMP/program3-tools"
          cd "$RUNNER_TEMP/program3-tools"
          curl --fail --location --retry 2 --max-time 240 -o lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux.tar.zst
          tar --zstd -xf lean.tar.zst
          export PATH="$PWD/lean-4.24.0-linux/bin:$PATH"
          git clone --filter=blob:none https://github.com/leanprover-community/mathlib4.git mathlib4
          cd mathlib4
          git checkout f897ebcf72cd16f89ab4577d0c826cd14afaafc7
          lake exe cache get Mathlib/Tactic.lean Mathlib/LinearAlgebra/Matrix/ConjTranspose.lean
          cd "$GITHUB_WORKSPACE"
          python workbench/program3/formal_audit.py --mathlib "$RUNNER_TEMP/program3-tools/mathlib4" --lean "$RUNNER_TEMP/program3-tools/lean-4.24.0-linux/bin/lean" --output "$RUNNER_TEMP/program3-evidence/formal"
      - name: Render and interact with the actual browser implementation
        if: always() && steps.science.outcome == 'success'
        run: |
          python workbench/program3/browser_ci.py --evidence "$RUNNER_TEMP/program3-evidence"
      - name: Build the research supplement and package evidence
        run: |
          python workbench/program3/package_ci.py --evidence "$RUNNER_TEMP/program3-evidence" --destination releases/program3-20261114
      - name: Publish verified evidence branch without modifying main
        run: |
          branch="program3-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add releases/program3-20261114 workbench/site/program3-assets workbench/site/program3-manifest.json
          git commit -m "Record independently verified program-three artifacts (run ${GITHUB_RUN_ID})"
          git push origin "HEAD:refs/heads/$branch"
          printf 'VERIFIED_EVIDENCE_BRANCH=%s\nVERIFIED_EVIDENCE_COMMIT=%s\n' "$branch" "$(git rev-parse HEAD)"
      - name: Preserve inspectable artifacts and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/program3-evidence
            releases/program3-20261114
          if-no-files-found: warn
          retention-days: 30
