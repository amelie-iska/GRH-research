<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 270" width="1100" height="270"><style>:root{--sd-soft:#e7f0eb;--sd-panel:#faf9f4;--sd-accent:#007467;--line:#c9cbc4;--ink:#202d2a;--muted:#5b6662}text{fill:var(--ink);font:13px monospace}.sd-flow-label{font-size:11px;fill:var(--muted)}.sd-flow-number{font-size:17px;fill:var(--sd-accent)}</style><title id="sdFlowTitle">Actual complete-column signed-divisor workflow</title><desc id="sdFlowDesc">Every dimension and mass belongs to the selected exact case; no training or asymptotic estimate.</desc><rect x="12" y="30" width="196" height="150" rx="2" fill="var(--sd-panel)" stroke="var(--line)"/><text class="sd-flow-label" x="24" y="58">01 / ORIGINAL COLUMNS</text><text class="sd-flow-number" x="24" y="99">20 × 16953</text><text class="sd-flow-label" x="24" y="137">raw phase table</text><path d="M210,106 h19 l-5,-5 m5,5 l-5,5" fill="none" stroke="var(--sd-accent)"/><rect x="232" y="30" width="196" height="150" rx="2" fill="var(--sd-panel)" stroke="var(--line)"/><text class="sd-flow-label" x="244" y="58">02 / IDEAL INCIDENCE</text><text class="sd-flow-number" x="244" y="99">21750 divisors</text><text class="sd-flow-label" x="244" y="137">73420 incidences</text><path d="M430,106 h19 l-5,-5 m5,5 l-5,5" fill="none" stroke="var(--sd-accent)"/><rect x="452" y="30" width="196" height="150" rx="2" fill="var(--sd-panel)" stroke="var(--line)"/><text class="sd-flow-label" x="464" y="58">03 / EXACT ROW STATES</text><text class="sd-flow-number" x="464" y="99">20 × 21750 × 3</text><text class="sd-flow-label" x="464" y="137">complex Fd(A,C,μ)</text><path d="M650,106 h19 l-5,-5 m5,5 l-5,5" fill="none" stroke="var(--sd-accent)"/><rect x="672" y="30" width="196" height="150" rx="2" fill="var(--sd-panel)" stroke="var(--line)"/><text class="sd-flow-label" x="684" y="58">04 / KEEP μ(d)</text><text class="sd-flow-number" x="684" y="99">543416 − 604844</text><text class="sd-flow-label" x="684" y="137">even / odd AA masses</text><path d="M870,106 h19 l-5,-5 m5,5 l-5,5" fill="none" stroke="var(--sd-accent)"/><rect x="892" y="30" width="196" height="150" rx="2" fill="var(--sd-soft)" stroke="var(--sd-accent)"/><text class="sd-flow-label" x="904" y="58">05 / SIGNED h=1</text><text class="sd-flow-number" x="904" y="99">-5119/5000</text><text class="sd-flow-label" x="904" y="137">divide by D once</text><text x="12" y="217">D=60000; U=244; H=3833; A1=37, A2=7; literal unit1, principal nu1; S above2,3.</text><text x="12" y="248">NEW fixed delta1/240000 profile; every annular SF ideal retained; finite row block, no asymptotic saving.</text></svg>
