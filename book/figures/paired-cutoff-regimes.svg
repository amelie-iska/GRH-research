<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="558" viewBox="0 0 760 558" role="img" aria-labelledby="title description">
  <title id="title">Where the pure cross reaches the target</title>
  <desc id="description">Regime map for the selected original pure two-pivot cross at R of order D to the three quarters. The horizontal axis is b = log base D of B, the erased cutoff norm, and the vertical axis is k = log base D of K, the insertion norm. Solid fill marks proved normalized O(D to the three quarters plus epsilon) comparisons over all d. The broad thresholds are k at least 1089/1420 for every b, b at least 1355/1482 for every k, and k at most 921/1652 for b at least 3/4. Dashed boundaries add reviewed affine central regions. The dotted boundary gives a conditional comparison below it when the fixed label product stays bounded. Unshaded cells remain open under the displayed comparisons. The map omits other label and divisor selectors and concerns neither the whole signed form nor a lower bound.</desc>
